- gz_topic_name: "/clock"
  ros_topic_name: "/clock"
  gz_type_name: "gz.msgs.Clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  direction: GZ_TO_ROS

- gz_topic_name: "/krabby/cmd_vel"
  ros_topic_name: "/krabi_ns/cmd_vel"
  gz_type_name: "gz.msgs.Twist"
  ros_type_name: "geometry_msgs/msg/Twist"
  direction: ROS_TO_GZ

# Odométrie : l'odom du DiffDrive (/krabby/odom, /model/krabby/tf) n'est plus bridgée, car
# elle intègre le patinage des roues motrices. sim_odometry.py publie odom->base_link et
# odom_simu à partir de la pose réelle (comme les roues codeuses du vrai robot).
- gz_topic_name: "/krabby/ground_truth"
  ros_topic_name: "/krabi_ns/odom_ground_truth"
  gz_type_name: "gz.msgs.Odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  direction: GZ_TO_ROS

- gz_topic_name: "/lidarObstacles"
  ros_topic_name: "/krabi_ns/scan_obstacles"
  gz_type_name: "gz.msgs.LaserScan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  direction: GZ_TO_ROS

- gz_topic_name: "/lidarObstacles/points"
  ros_topic_name: "/krabi_ns/scan_obstaclesPC2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  direction: GZ_TO_ROS

- gz_topic_name: "/lidarLoc"
  ros_topic_name: "/krabi_ns/scan_loc"
  gz_type_name: "gz.msgs.LaserScan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  direction: GZ_TO_ROS

- gz_topic_name: "/lidarLoc/points"
  ros_topic_name: "/krabi_ns/scan_locPC2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  direction: GZ_TO_ROS

- gz_topic_name: "/camera/image_raw"
  ros_topic_name: "/krabi_ns/krabi_cam_simu/image_raw"
  gz_type_name: "gz.msgs.Image"
  ros_type_name: "sensor_msgs/msg/Image"
  direction: GZ_TO_ROS

# gz topic published by Sensors plugin (Camera)
- gz_topic_name: "camera/camera_info"
  ros_topic_name: "/krabi_ns/krabi_cam/camera_info"
  gz_type_name: "gz.msgs.CameraInfo"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  direction: GZ_TO_ROS

- gz_topic_name: "imu"
  ros_topic_name: "/krabi_ns/imu"
  gz_type_name: "gz.msgs.IMU"
  ros_type_name: "sensor_msgs/msg/Imu"
  direction: GZ_TO_ROS